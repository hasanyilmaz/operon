name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Verify release dependency audit policy
        run: npm run release:audit-policy

      - name: Run validation
        env:
          OPERON_TASK_FINDER_PERFORMANCE_MODE: diagnostic
        run: npm run check

      - name: Verify release guard
        run: npm run release:guard

      - name: Verify final accepted Public V1 freeze
        run: npm run release:freeze:check
