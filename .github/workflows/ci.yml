name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact workflow revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Fetch pull-request base for validation classification
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Classify pull-request validation surface
        id: pr-surface
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci/classify-pr-validation-surface.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit CLI compatibility review
        if: github.event_name == 'pull_request' && steps.pr-surface.outputs.cli_compat_review == 'true'
        shell: bash
        run: |
          echo "Historical CLI compatibility evidence changed."
          echo "Run the explicitly requested CLI compatibility lane before changing these paths."
          exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Run main validation
        run: npm run check:main
        if: github.event_name == 'push'

      - name: Run Plugin candidate validation
        if: github.event_name == 'pull_request'
        env:
          OPERON_TASK_FINDER_PERFORMANCE_MODE: diagnostic
        run: npm run check:plugin

      - name: Verify release dependency audit policy
        run: npm run release:audit-policy

      - name: Verify release-sensitive Plugin guard
        if: github.event_name == 'pull_request' && steps.pr-surface.outputs.plugin_release_guard == 'true'
        run: npm run release:guard -- --scope plugin

      - name: Report non-blocking CLI impact
        shell: bash
        run: |
          impact="$(npm run --silent agent-runtime:cli-impact)"
          printf '%s\n' "$impact"
          {
            echo '### CLI impact'
            echo '```json'
            echo "$impact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows-native:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact workflow revision
        shell: pwsh
        run: |
          $expected = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "Workflow checkout SHA mismatch" }

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        run: npm install --global npm@11.12.1

      - name: Verify canonical toolchain
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.18.0") { throw "Unexpected Node version" }
          if ((npm --version) -ne "11.12.1") { throw "Unexpected npm version" }

      - name: Run canonical Windows Plugin validation
        run: npm run validate:windows:plugin
