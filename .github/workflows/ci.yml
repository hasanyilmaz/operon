name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validation gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact workflow revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts for seal classification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run build

      - name: Classify exact evidence-seal commit
        id: evidence_seal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          classification="$(npm run --silent release:evidence-seal:classify)"
          mode="$(node -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.mode);' "$classification")"
          test "$mode" = candidate || test "$mode" = evidence-seal
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Verify release dependency audit policy
        run: npm run release:audit-policy

      - name: Run validation
        env:
          OPERON_TASK_FINDER_PERFORMANCE_MODE: diagnostic
        run: npm run check
        if: github.event_name == 'push' && steps.evidence_seal.outputs.mode != 'evidence-seal'

      - name: Run paired candidate validation
        if: github.event_name == 'pull_request'
        env:
          OPERON_TASK_FINDER_PERFORMANCE_MODE: diagnostic
        run: npm run check:candidate

      - name: Verify release guard
        run: npm run release:guard

      - name: Verify exact evidence seal and hosted proof
        if: github.event_name == 'push' && steps.evidence_seal.outputs.mode == 'evidence-seal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run release:evidence-seal:check
          npm run release:hosted-evidence:check
          npm run agent-runtime:external-cli:public-proof
          npm run release:freeze:check

      - name: Verify candidate Public V1 freeze
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.evidence_seal.outputs.mode != 'evidence-seal'
        run: npm run candidate:freeze:check

  windows-native:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact workflow revision
        shell: pwsh
        run: |
          $expected = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "Workflow checkout SHA mismatch" }

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        run: npm install --global npm@11.12.1

      - name: Verify canonical toolchain
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.18.0") { throw "Unexpected Node version" }
          if ((npm --version) -ne "11.12.1") { throw "Unexpected npm version" }

      - name: Install dependencies
        if: github.event_name == 'push'
        run: npm ci

      - name: Build release artifacts for seal classification
        if: github.event_name == 'push'
        run: npm run build

      - name: Classify exact evidence-seal commit
        id: evidence_seal
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $classification = npm run --silent release:evidence-seal:classify | ConvertFrom-Json
          if ($classification.mode -notin @('candidate', 'evidence-seal')) { throw "Unexpected release evidence mode" }
          "mode=$($classification.mode)" >> $env:GITHUB_OUTPUT

      - name: Run validation
        env:
          OPERON_TASK_FINDER_PERFORMANCE_MODE: diagnostic
        run: npm run check
        if: github.event_name == 'push' && steps.evidence_seal.outputs.mode != 'evidence-seal'

      - name: Run canonical Windows candidate validation
        if: github.event_name == 'pull_request'
        run: npm run validate:windows:candidate

      - name: Run required native transport validation
        if: github.event_name == 'push' && steps.evidence_seal.outputs.mode != 'evidence-seal'
        env:
          OPERON_REQUIRE_NATIVE_TRANSPORT: "1"
        run: npm run agent-runtime:transport:native:test

      - name: Verify tracked runner URL portability
        if: github.event_name == 'push' && steps.evidence_seal.outputs.mode != 'evidence-seal'
        shell: pwsh
        run: |
          $matches = git grep -n -F "new URL(import.meta.url).pathname" -- "*.mjs" "*.ts"
          if ($LASTEXITCODE -eq 0) {
            $matches
            throw "Tracked runner still uses URL.pathname"
          }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          exit 0

      - name: Verify exact evidence seal
        if: github.event_name == 'push' && steps.evidence_seal.outputs.mode == 'evidence-seal'
        run: npm run release:evidence-seal:check

      - name: Verify tracked worktree remains clean
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git diff --exit-code
          git diff --cached --exit-code
