name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  surface:
    name: Classify validation surface
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.surface.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Classify validation surface
        id: surface
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/classify-pr-validation-surface.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  validate:
    name: Validation gate
    needs: surface
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require successful classification
        if: needs.surface.result != 'success'
        run: exit 1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact workflow revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Validate docs package
        if: needs.surface.outputs.docs_only == 'true'
        run: |
          node --test scripts/test-operon-docs-package.mjs
          git diff --check "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" HEAD -- docs/operon-docs docs/media
          echo "docs-only — package validated; plugin checks not applicable" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify pull-request validation surface
        id: pr-surface
        if: github.event_name == 'pull_request' && needs.surface.outputs.docs_only != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/ci/classify-pr-validation-surface.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require immutable Runtime V1 baseline
        if: github.event_name == 'pull_request' && steps.pr-surface.outputs.runtime_baseline_mutation == 'true'
        shell: bash
        run: |
          echo "The Runtime V1 baseline is an immutable release boundary."
          echo "Keep it unchanged for additive Plugin-first work; plan a separate Runtime-major or release-boundary update if needed."
          exit 1

      - name: Require explicit CLI compatibility review
        if: github.event_name == 'pull_request' && steps.pr-surface.outputs.cli_compat_review == 'true'
        shell: bash
        run: |
          echo "Historical CLI compatibility evidence changed."
          echo "Run the explicitly requested CLI compatibility lane before changing these paths."
          exit 1

      - name: Set up Node
        if: needs.surface.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        if: needs.surface.outputs.docs_only != 'true'
        run: npm install --global npm@11.12.1

      - name: Install dependencies
        if: needs.surface.outputs.docs_only != 'true'
        run: npm ci

      - name: Run main validation
        run: npm run check:main
        if: github.event_name == 'push' && needs.surface.outputs.docs_only != 'true'
        env:
          OPERON_PUSH_BASE_SHA: ${{ github.event.before }}
          OPERON_PUSH_HEAD_SHA: ${{ github.sha }}

      - name: Run Plugin candidate validation
        if: github.event_name == 'pull_request' && needs.surface.outputs.docs_only != 'true'
        env:
          OPERON_TASK_FINDER_PERFORMANCE_MODE: diagnostic
        run: npm run check:plugin

      - name: Verify release dependency audit policy
        if: needs.surface.outputs.docs_only != 'true'
        run: npm run release:audit-policy

      - name: Verify release-sensitive Plugin guard
        if: github.event_name == 'pull_request' && steps.pr-surface.outputs.plugin_release_guard == 'true'
        run: npm run release:guard -- --scope plugin

      - name: Report non-blocking CLI impact
        if: needs.surface.outputs.docs_only != 'true'
        shell: bash
        run: |
          impact="$(npm run --silent agent-runtime:cli-impact)"
          printf '%s\n' "$impact"
          {
            echo '### CLI impact'
            echo '```json'
            echo "$impact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  windows-native:
    needs: surface
    if: always()
    runs-on: ${{ (needs.surface.outputs.docs_only == 'true' || needs.surface.result != 'success') && 'ubuntu-latest' || 'windows-2022' }}

    steps:
      - name: Require successful classification
        if: needs.surface.result != 'success'
        shell: bash
        run: exit 1
      - name: Docs-only Windows validation not applicable
        if: needs.surface.outputs.docs_only == 'true'
        shell: bash
        run: echo "docs-only — Windows validation not applicable" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out repository
        if: needs.surface.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact workflow revision
        if: needs.surface.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          $expected = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          $actual = git rev-parse HEAD
          if ($actual -ne $expected) { throw "Workflow checkout SHA mismatch" }

      - name: Set up Node
        if: needs.surface.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Pin canonical npm
        if: needs.surface.outputs.docs_only != 'true'
        run: npm install --global npm@11.12.1

      - name: Verify canonical toolchain
        if: needs.surface.outputs.docs_only != 'true'
        shell: pwsh
        run: |
          if ((node --version) -ne "v24.18.0") { throw "Unexpected Node version" }
          if ((npm --version) -ne "11.12.1") { throw "Unexpected npm version" }

      - name: Run canonical Windows Plugin validation
        if: needs.surface.outputs.docs_only != 'true'
        run: npm run validate:windows:plugin
