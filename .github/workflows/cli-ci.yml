name: Operon CLI

on:
  pull_request:
    paths:
      - "packages/operon-cli/**"
      - "src/agent-runtime/**"
      - "contracts/agent-runtime/**"
      - "scripts/agent-runtime/cli/**"
      - "scripts/agent-runtime/cli-transport/**"
      - "scripts/agent-runtime/contracts/**"
      - "scripts/agent-runtime/receipts/**"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/cli-release-ready.yml"
      - ".github/workflows/cli-native-candidate.yml"
      - ".github/workflows/cli-live-acceptance.yml"
      - ".github/workflows/cli-publish.yml"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "packages/operon-cli/**"
      - "src/agent-runtime/**"
      - "contracts/agent-runtime/**"
      - "scripts/agent-runtime/cli/**"
      - "scripts/agent-runtime/cli-transport/**"
      - "scripts/agent-runtime/contracts/**"
      - "scripts/agent-runtime/receipts/**"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/cli-release-ready.yml"
      - ".github/workflows/cli-native-candidate.yml"
      - ".github/workflows/cli-live-acceptance.yml"
      - ".github/workflows/cli-publish.yml"
      - "package.json"

jobs:
  prepare-portability-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: matrix
        name: Build the canonical 9-cell hosted portability matrix
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const freeze = JSON.parse(fs.readFileSync("contracts/agent-runtime/native-acceptance-matrix-v1.json", "utf8"));
            const include = freeze.hostedPortability.flatMap(os => freeze.nodeVersions.map(node => ({
              cellId: `${os.id}-node-${node.major}`,
              osRef: os.id,
              platform: os.platform,
              node: node.version,
              nodeMajor: String(node.major),
              runner: os.runner
            })));
            if (include.length !== freeze.expectedCells.hostedPortability) throw new Error(`Expected ${freeze.expectedCells.hostedPortability} portability cells, received ${include.length}.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          '

  platform-portability:
    name: Portability (${{ matrix.osRef }}, Node ${{ matrix.node }})
    needs: prepare-portability-matrix
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-portability-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run agent-runtime:contracts
      - run: node scripts/agent-runtime/cli/run-hosted-transport-security-tests.mjs
      - run: npm run agent-runtime:cli
      - run: npm run agent-runtime:cli:package
      - run: node --test scripts/agent-runtime/cli/hosted-portability.test.mjs

  shell-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: npm ci
      - name: Install Fish and Zsh for executable completion acceptance
        run: |
          sudo apt-get update
          sudo apt-get install --yes fish zsh
      - run: node scripts/agent-runtime/cli/run-phase9-client-tests.mjs
